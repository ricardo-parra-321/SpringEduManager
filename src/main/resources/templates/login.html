<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <!-- Enlace a Bootstrap para los estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card shadow p-4" style="width: 25rem;">
        <h3 class="text-center mb-4 text-primary">SpringEduManager</h3>
        
        <div th:if="${param.error}" class="alert alert-danger text-center">
            Usuario o contraseña incorrectos.
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario:</label>
                <input type="text" name="username" class="form-control" placeholder="Ej: admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
        </form>
    </div>

</body>
</html>
