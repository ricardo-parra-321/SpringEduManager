<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">SpringEduManager</span>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/estudiantes}">Estudiantes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/cursos}">Cursos</a>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="d-flex m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Columna Izquierda: Formulario -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white fw-bold">Nuevo Curso</div>
                    <div class="card-body">
                        <form th:action="@{/cursos}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Curso:</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción:</label>
                                <input type="text" name="descripcion" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Curso</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Columna Derecha: Tabla de datos -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold">Catálogo de Cursos</div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover m-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="curso : ${cursos}">
                                    <td th:text="${curso.nombre}"></td>
                                    <td th:text="${curso.descripcion}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
